# FlowDesk — site estático (sem build)
[build]
  publish = "."

# URL antiga sem extensão continua funcionando
[[redirects]]
  from = "/termos-e-diretrizes"
  to = "/termos-e-diretrizes.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
